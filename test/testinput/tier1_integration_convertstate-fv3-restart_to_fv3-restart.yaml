input geometry:
  geometry_type: fv3
  fms initialization:
    namelist filename: data/fv3/input_c12_1tile.nml
    field table filename: data/fv3/field_table
  npx: 13
  npy: 13
  npz: 127
  ntiles: 1
  akbk: gfs_127

output geometry:
  geometry_type: fv3
  fms initialization:
    namelist filename: data/fv3/input_c24_1tile.nml
    field table filename: data/fv3/field_table
  npx: 25
  npy: 25
  npz: 127
  ntiles: 1
  akbk: gfs_127

states:
- input:
    date: 2020-12-15T00:00:00Z
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    io:
      filetype: fv3 restart
      datapath: data_generated/fv3/
      filename_core: fv_core.res.tile1.nc
      filename_trcr: fv_tracer.res.tile1.nc
      filename_sfcd: sfc_data.res.tile1.nc
      filename_sfcw: fv_srf_wnd.res.tile1.nc
      filename_cplr: coupler.res
      field io names:
        eastward_wind: ugrd
        northward_wind: vgrd
        air_temperature: tmp
        air_pressure_thickness: dpres
  output:
    date: 2020-12-15T00:00:00Z
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    io:
      filetype: fv3 restart
      datapath: data_generated/fv3/
      filename_core: c24_fv_core.res.tile1.nc
      filename_trcr: c24_fv_tracer.res.tile1.nc
      filename_sfcd: c24_sfc_data.res.tile1.nc
      filename_sfcw: c24_fv_srf_wnd.res.tile1.nc
      filename_cplr: c24_coupler.res
      field io names:
        eastward_wind: ugrd
        northward_wind: vgrd
        air_temperature: tmp
        air_pressure_thickness: dpres

test:
  reference filename: testref/convertstate-fv3-restart-to-fv3-restart.test
